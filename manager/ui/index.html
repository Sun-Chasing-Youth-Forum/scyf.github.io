<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; frame-src 'none'; base-uri 'none'">
  <title>逐日青年论坛 · 网站管理器</title>
  <link rel="icon" href="app-icon.svg" type="image/svg+xml"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="icons.css">
  <script src="app.js" defer></script>
</head>
<body>
  <aside id="sidebar">
    <div class="brand"><img src="app-icon.svg" alt="逐日青年论坛网站管理器图标"><div><strong>逐日青年论坛</strong><span>网站管理器 <small>0.1.1</small></span></div></div>
    <div class="nav-caption">内容工作区</div>
    <nav id="navigation" aria-label="管理导航"></nav>
    <div class="sidebar-bottom"><div class="orbit-mark">☀</div><p>让知识持续流动<br><span>Sun-Chasing Youth Forum</span></p><button class="site-link" data-action="website">访问正式网站 ↗</button></div>
  </aside>
  <div class="workspace">
    <header class="topbar"><div id="breadcrumb">工作台</div><div class="top-actions"><span id="connection" class="connection">离线体验</span><button class="button secondary small" data-action="sync">↻ 读取最新内容</button><button id="account" class="account" data-action="settings">登录 GitHub</button></div></header>
    <main id="main"><p class="loading">正在打开内容工作区…</p></main>
    <footer class="bottom-bar"><span id="save-state">内容仅保存在本机；发布后才会更新网站。</span><button id="publish-button" class="button" data-action="review">预览与发布 <span id="draft-count">0</span></button></footer>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div>
</body>
</html>
