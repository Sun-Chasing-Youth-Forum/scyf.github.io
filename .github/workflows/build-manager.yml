name: Build website manager

on:
  workflow_dispatch:
  push:
    branches: [preview/website-manager]
    paths:
      - 'manager/**'
      - '.github/workflows/build-manager.yml'

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: win
            arch: x64
          - os: macos-latest
            platform: mac
            arch: arm64
          - os: macos-latest
            platform: mac
            arch: x64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: manager
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: manager/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx electron-builder --${{ matrix.platform }} zip --${{ matrix.arch }} --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: SCYF-Manager-${{ matrix.platform }}-${{ matrix.arch }}
          path: manager/release/*.zip
          retention-days: 30
